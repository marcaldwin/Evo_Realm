[project]
name = "evorealm-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.51.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
